name: Bug report
description: Report a problem with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2025.1.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Enable debug logging for `custom_components.southglos_bins` and paste any
        related entries. Remove your postcode / UPRN if you prefer.
      render: text
