name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest
            install: -r requirements_test.txt
          # Oldest harness release for the hacs.json minimum (2026.3.0); no
          # harness build pins 2026.3.0 itself, so this tests 2026.3.1.
          - name: minimum
            install: pytest-homeassistant-custom-component==0.13.317
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: pip install ${{ matrix.install }}
      - run: pytest
