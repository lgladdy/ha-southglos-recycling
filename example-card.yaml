# Example dashboard for the South Gloucestershire Recycling Collections integration.
#
# How to use:
#   1. Settings -> Dashboards -> Add dashboard -> "New dashboard from scratch".
#   2. Open it, then the pencil -> three dots -> "Raw configuration editor".
#   3. Paste this whole file, then find and replace `my_address` with your own
#      entity prefix, e.g. `2_westerleigh_road` for a device named
#      "2 Westerleigh Road" (see Settings -> Devices & services -> Entities).
#
# Uses only built-in cards. Tiles for collection types your address doesn't
# have hide themselves; also remove those calendars from the calendar card.
#
# The "Today" section uses automation-style visibility conditions, which need
# Home Assistant 2026.10 or newer. On older versions, delete that section.
views:
  - title: Bins
    path: bins
    icon: mdi:recycle
    type: sections
    max_columns: 3
    header:
      layout: start
      card:
        type: markdown
        text_only: true
        content: |-
          {%- set p = 'sensor.my_address_next_' -%}
          {%- set types = ['refuse', 'recycling', 'food', 'garden'] -%}
          {%- set ns = namespace(today=[], dates=[]) -%}
          {%- for t in types -%}
            {%- set e = p ~ t ~ '_collection' -%}
            {%- if state_attr(e, 'is_collection_day') -%}{%- set ns.today = ns.today + [t | title] -%}{%- endif -%}
            {%- if has_value(e) -%}{%- set ns.dates = ns.dates + [states(e)] -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.today -%}
          ## 🚛 Collection day
          **{{ ns.today | join(' & ') }}** today · live status updates every 15 minutes
          {%- elif ns.dates -%}
          {%- set d = ns.dates | min -%}
          {%- set nsd = namespace(names=[]) -%}
          {%- for t in types -%}{%- if states(p ~ t ~ '_collection') == d -%}{%- set nsd.names = nsd.names + [t | title] -%}{%- endif -%}{%- endfor -%}
          {%- set days = (as_datetime(d).date() - now().date()).days -%}
          ## Next up: {{ nsd.names | join(' & ') }}
          {{ as_datetime(d).strftime('%A %-d %B') }} · {{ 'today' if days == 0 else 'tomorrow' if days == 1 else 'in ' ~ days ~ ' days' }}
          {%- else -%}
          ## Bin collections
          No collection data yet
          {%- endif -%}
    sections:
      # Only shown on collection days.
      - type: grid
        column_span: 3
        visibility:
          - condition: or
            conditions:
              - condition: state
                entity_id: sensor.my_address_next_refuse_collection
                attribute: is_collection_day
                state: true
              - condition: state
                entity_id: sensor.my_address_next_recycling_collection
                attribute: is_collection_day
                state: true
              - condition: state
                entity_id: sensor.my_address_next_food_collection
                attribute: is_collection_day
                state: true
              - condition: state
                entity_id: sensor.my_address_next_garden_collection
                attribute: is_collection_day
                state: true
        cards:
          - type: heading
            heading: Today
            icon: mdi:truck-fast
          - type: tile
            entity: sensor.my_address_refuse_collection_status
            name: Refuse
            icon: mdi:delete
            color: blue-grey
            state_content:
              - state
              - reason
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity_id: sensor.my_address_next_refuse_collection
                attribute: is_collection_day
                state: true
          - type: tile
            entity: sensor.my_address_recycling_collection_status
            name: Recycling
            icon: mdi:recycle
            color: green
            state_content:
              - state
              - reason
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity_id: sensor.my_address_next_recycling_collection
                attribute: is_collection_day
                state: true
          - type: tile
            entity: sensor.my_address_food_collection_status
            name: Food
            icon: mdi:food-apple
            color: brown
            state_content:
              - state
              - reason
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity_id: sensor.my_address_next_food_collection
                attribute: is_collection_day
                state: true
          - type: tile
            entity: sensor.my_address_garden_collection_status
            name: Garden
            icon: mdi:tree
            color: light-green
            state_content:
              - state
              - reason
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity_id: sensor.my_address_next_garden_collection
                attribute: is_collection_day
                state: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Next collections
            icon: mdi:calendar-clock
          - type: tile
            entity: sensor.my_address_next_refuse_collection
            name: Refuse
            color: blue-grey
            vertical: true
            state_content:
              - status
              - state
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.my_address_next_refuse_collection
                state_not: unavailable
          - type: tile
            entity: sensor.my_address_next_recycling_collection
            name: Recycling
            color: green
            vertical: true
            state_content:
              - status
              - state
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.my_address_next_recycling_collection
                state_not: unavailable
          - type: tile
            entity: sensor.my_address_next_food_collection
            name: Food
            color: brown
            vertical: true
            state_content:
              - status
              - state
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.my_address_next_food_collection
                state_not: unavailable
          - type: tile
            entity: sensor.my_address_next_garden_collection
            name: Garden
            color: light-green
            vertical: true
            state_content:
              - status
              - state
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.my_address_next_garden_collection
                state_not: unavailable
      - type: grid
        cards:
          - type: heading
            heading: Schedule
            icon: mdi:calendar-sync
          - type: tile
            entity: sensor.my_address_refuse_collection_status
            name: Refuse
            icon: mdi:delete
            color: blue-grey
            state_content:
              - schedule
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_address_refuse_collection_status
                state_not: unavailable
          - type: tile
            entity: sensor.my_address_recycling_collection_status
            name: Recycling
            icon: mdi:recycle
            color: green
            state_content:
              - schedule
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_address_recycling_collection_status
                state_not: unavailable
          - type: tile
            entity: sensor.my_address_food_collection_status
            name: Food
            icon: mdi:food-apple
            color: brown
            state_content:
              - schedule
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_address_food_collection_status
                state_not: unavailable
          - type: tile
            entity: sensor.my_address_garden_collection_status
            name: Garden
            icon: mdi:tree
            color: light-green
            state_content:
              - schedule
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_address_garden_collection_status
                state_not: unavailable
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Calendar
            icon: mdi:calendar-month
          - type: calendar
            initial_view: dayGridMonth
            entities:
              - calendar.my_address_refuse_collection
              - calendar.my_address_recycling_collection
              - calendar.my_address_food_collection
              - calendar.my_address_garden_collection
            grid_options:
              columns: full
              rows: 10
